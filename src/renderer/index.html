<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Mitate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="heading">Mitate</h1>
    <section>
      <h2>New collection</h2>
      <label>Name <input type="text" data-testid="collection-name" /></label>
      <button type="button" data-testid="add-folder">Add folder</button>
      <ul data-testid="folder-list"></ul>
      <button type="button" data-testid="create-collection">Create collection</button>
      <p data-testid="create-error" role="alert" hidden></p>
      <p class="create-notice" data-testid="create-notice" role="status" hidden></p>
    </section>
    <section>
      <h2>Collections</h2>
      <ul data-testid="collection-list"></ul>
    </section>
    <section data-testid="manage-panel" hidden>
      <h2>Manage collection</h2>
      <label>Name <input type="text" data-testid="rename-input" disabled /></label>
      <button type="button" data-testid="rename-button" disabled>Rename</button>
      <ul data-testid="manage-folders"></ul>
      <button type="button" data-testid="add-folder-button" disabled>Add folder</button>
      <button type="button" data-testid="delete-collection-button" disabled>Delete collection</button>
      <p class="manage-error" data-testid="manage-error" role="alert" hidden></p>
      <p class="manage-notice" data-testid="manage-notice" role="status" hidden></p>
    </section>
    <section>
      <h2>Files</h2>
      <div data-testid="rescan-section">
        <button type="button" data-testid="rescan" disabled>Rescan</button>
        <span data-testid="rescan-status" role="status"></span>
      </div>
      <div class="view-tabs" role="tablist" aria-label="Views" data-testid="view-tabs"></div>
      <div class="view-area" role="tabpanel" data-testid="view-area">
        <div class="tree-view" data-testid="tree-view"></div>
        <div class="list-view view-inactive" data-testid="list-view"></div>
      </div>
    </section>
    <section class="file-detail">
      <h2>File location</h2>
      <p class="file-path" data-testid="file-path"></p>
      <button type="button" data-testid="reveal" disabled>Reveal in Finder</button>
      <p class="reveal-error" data-testid="reveal-error" role="alert" hidden></p>
    </section>
    <script src="renderer.js"></script>
    <script src="../shared/path-compare.js"></script>
    <script src="../shared/tree-model.js"></script>
    <script src="../shared/type-list.js"></script>
    <script src="../shared/type-list-cache.js"></script>
    <script src="../shared/list-window.js"></script>
    <script src="../shared/tabs-model.js"></script>
    <script src="tree-view.js"></script>
    <script src="list-view.js"></script>
    <script src="view-tabs.js"></script>
    <script src="type-views.js"></script>
    <script src="../shared/file-detail.js"></script>
    <script src="file-detail.js"></script>
    <script src="create-collection.js"></script>
    <script src="collection-busy.js"></script>
    <script src="collection-manage.js"></script>
    <script src="rescan-button.js"></script>
  </body>
</html>
